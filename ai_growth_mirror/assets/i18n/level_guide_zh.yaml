headline: "你现在位于 {current_level}（{current_score} 分）。等级本身不是标签，关键在于知道下一步该补什么。"
headline_unrated: "当前样本还不足以正式判级，先用完整等级定义帮助你理解后续进阶方向。"

levels:
  L1:
    score_range: "0-29"
    title: "试探使用"
    description: "AI 还停留在临时帮手层面，会话短、验证少、方法难以迁移。"
    signals:
      - "更多是问答，不是协作"
      - "很少形成计划或验收"
      - "结果依赖临场发挥"
    next_step: "先把“目标 + 约束 + 验收”写进首轮消息。"
  L2:
    score_range: "30-59"
    title: "形成习惯中"
    description: "已经开始把 AI 拉进真实工作，但协作习惯还不稳定，常见问题是验证、范围和方法沉淀不足。"
    signals:
      - "开始让 AI 执行真实任务"
      - "偶尔有计划和验证动作"
      - "不同会话质量波动较大"
    next_step: "把计划先行和输出验证变成默认动作，先稳住主链路质量。"
  L3:
    score_range: "60-79"
    title: "稳定协作者"
    description: "已经具备比较成熟的协作闭环，能把 AI 用于多步任务推进，并持续交付结果。"
    signals:
      - "复杂任务能持续推进"
      - "会显式管理范围"
      - "开始有可复用的方法样本"
    next_step: "从“会用”走向“会复制”，把高质量做法模板化。"
  L4:
    score_range: "80-89"
    title: "高杠杆操盘"
    description: "不只是会用 AI，而是能有意识地编排工作流、组合工具和验证链路。"
    signals:
      - "多工具协作自然"
      - "复杂问题能拆并行路径"
      - "高质量会话占比稳定"
    next_step: "继续提升方法资产化与组织可复制性。"
  L5:
    score_range: "90-100"
    title: "工作流设计者"
    description: "你已经在设计和复制高杠杆 AI 工作方式，重点不再是会不会用，而是如何规模化复用。"
    signals:
      - "能持续产出模板/Skill/流程"
      - "问题拆解与验收非常稳定"
      - "方法可被他人学习和迁移"
    next_step: "把个人方法沉淀成可分享资产，形成外部影响力。"
