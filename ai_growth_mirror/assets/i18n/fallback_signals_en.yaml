pq_texts:
  effective_context_desc: "The opening prompt already included key files, errors, or code context, so AI could move faster."
  reinforce_context_label: "Keep the opening-context habit"
  context_what_worked: "You brought the key files, symptoms, and context into the first turn."
  context_why_effective: "That reduces guessing and follow-up questions, so the first answer is closer to an executable result."
  missing_context_desc: "The opening prompt missed key files, symptoms, or boundaries, so AI had to clarify before moving."
  missing_context_improvement: "Front-load the symptom, relevant files, constraints, and acceptance in the first message."
  improve_context_label: "Rebuild the opening context block"
  context_better_prompt: "Symptom: [issue]\nRelevant files: [paths]\nConstraints: [must not change]\nDone when: [verification]"
  context_why_improve: "Giving enough context up front reduces rework and clarification turns."
  precise_request_desc: "The opening request set a clearer target and boundary, making execution easier."
  missing_acceptance_desc: "Without explicit acceptance criteria, AI is more likely to stop too early."
  missing_acceptance_improvement: "Add one minimal, verifiable definition of done."
  vague_request_desc: "When the request is too short or vague, AI tends to give advice instead of direct output."
  vague_request_improvement: "Rewrite the ask as diagnose -> modify -> verify -> summarize."
  unclear_correction_desc: "Multiple interruptions without a reset boundary make correction more expensive."
  unclear_correction_improvement: "When correcting, say what was wrong, what the correct boundary is, and what to do next."
