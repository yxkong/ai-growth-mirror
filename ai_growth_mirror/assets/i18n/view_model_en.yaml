prompt_coach:
  strength_card:
    label_prefix: "Keep this habit: {label}"
    evidence: "This is currently your most stable prompt habit, so it is already becoming reusable."
    message: "Do not only fix weaknesses; transfer this strength into more task types."
    action: "Over the next two weeks, deliberately reuse the {label} habit in three different tasks."
  deficit_cards:
    missing-context:
      label: "Most turn-wasting pattern: missing context"
      kind: "Evidence"
      evidence: "{count} recent sessions show missing-context signals, so the AI often clarifies before it can move."
      action: "Turn goal, symptom, files, constraints, and acceptance into a fixed opening skeleton."
    missing-acceptance-criteria:
      label: "Most early-closure pattern: missing acceptance"
      kind: "Evidence"
      evidence: "{count} recent sessions lack explicit done criteria, so the AI closes too early."
      action: "Always state one minimal verifiable acceptance condition."
    vague-request:
      label: "Most advice-prone pattern: vague request"
      kind: "Evidence"
      evidence: "{count} recent sessions use wish-like requests, which invite advice instead of execution."
      action: "Rewrite the request into diagnose, modify, verify, summarize."
    unclear-correction:
      label: "Most drift-prone pattern: weak correction"
      kind: "Evidence"
      evidence: "{count} recent sessions show a weak boundary reset after drift."
      action: "State the mistake, the correct boundary, and the next step together."
  deficit_message: "This is not a one-off miss; it is the most stable failure pattern right now."
  dimension_gap_message: "If this gap becomes stable, both clarification count and rework cost will drop."
  dimension_cards:
    context_provision:
      label: "Front-load context instead of letting the AI guess"
      kind: "Gap"
      evidence: "When files, symptoms, or constraints are missing, rework climbs quickly."
      action: "State symptom, relevant files, constraints, and acceptance in the first turn."
      better_prompt: |
        [Bug Fix]
        Symptom: [exact error or unexpected behavior]
        Reproduce: [steps to trigger]
        Files: [path1, path2]
        Constraints: [what must not change]
        Done when: [how to verify the fix]
    request_specificity:
      label: "Ask for actions, not wishes"
      kind: "Gap"
      evidence: "Open-ended requests invite advice instead of execution."
      action: "Replace generic help with diagnose → modify → verify → summarize."
      better_prompt: |
        [Feature Implementation]
        Goal: [one-sentence feature description]
        Current state: [relevant code or system state]
        Constraints: [interfaces or files that cannot change]
        First step only: [smallest increment, not the full feature]
        Done when: [how to verify success]
    scope_management:
      label: "Lock scope before execution"
      kind: "Gap"
      evidence: "When scope is fuzzy, AI tends to widen the change surface."
      action: "State allowed files, forbidden areas, and whether interfaces may change."
      better_prompt: |
        [Refactor / Optimize]
        Scope: [only these files or modules]
        Goal: [one-sentence improvement target]
        Forbidden: [interfaces or behaviors that must stay the same]
        First step: [where to start, what done looks like for step 1]
        Done when: [existing tests green + manual check point]
    information_timing:
      label: "Do not add the crucial context too late"
      kind: "Gap"
      evidence: "Late constraints make the first few turns partially wasted."
      action: "Front-load the key constraints instead of correcting after the AI started."
      better_prompt: |
        [Design / Decision]
        Decision: [which two approaches to choose between]
        Constraints: [performance / maintainability / time]
        Background: [current architecture or tech stack]
        Expected output: [comparison + recommendation, no code yet]
    correction_quality:
      label: "Make course-correction directional"
      kind: "Gap"
      evidence: "Saying only 'this is wrong' does not steer fast enough."
      action: "Use what is wrong → correct boundary → next step."
      better_prompt: |
        [Incremental / Course-correction]
        Previous issue: [what specifically was wrong]
        Correct boundary: [what should and should not happen]
        This step only: [the smallest next action]
        Done when: [clear completion signal for this step]
  from_coaching:
    source_note: "This prompt coach is LLM-personalized and grounded in this cycle's real session data."
  takeaway_actions:
    kind_example: "Real example"
    kind_reinforce: "Keep this"
    improve: "Use the structure below for your next opening message."
    reinforce: "Carry this working pattern into a different task type."
  heuristic_dim_labels:
    constraint: "Constraint completeness"
    context: "Context quality"
    clarity: "Expression clarity"
    depth: "Task depth"
  heuristic_cards:
    constraint:
      message: "Add explicit constraints like 'do not touch X' or 'only modify Y' in your first message; this cuts rework by 30%+."
      action: "In your next opening message, state allowed files, forbidden areas, and whether interfaces may change."
    context:
      message: "Attach relevant code snippets or file references so AI doesn't have to guess context."
      action: "Attach target file paths, key code snippets, and the current symptom in your first turn."
    clarity:
      message: "High tool error rate often signals vague prompts. Describe issues as 'symptom + expected result + environment'."
      action: "Rewrite the issue as symptom, expected result, and runtime environment."
    depth:
