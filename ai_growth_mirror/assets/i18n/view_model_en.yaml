methodology:
  title: "AI Growth Mirror judges around four collaboration pillars (expanded into a six-axis radar)"
  lines:
    - "Context Frame: whether boundaries (goals, constraints, and acceptance criteria) are established during alignment, either through initial prompt or interactive clarification."
    - "Flow Orchestration: whether AI can keep moving instead of needing manual rescue every step."
    - "Proof Loop: whether you verify, test, and review instead of stopping at plausibility."
    - "Method Asset: whether effective patterns are preserved as templates, rules, scripts, or reusable flows."
    - "These four pillars expand into the six scored axes: Context Frame -> collaboration framing; Flow Orchestration -> execution driving + implementation depth; Proof Loop -> delivery closure + adaptive recovery; Method Asset -> agentic system."

