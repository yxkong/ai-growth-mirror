growth_gaps:
  framing_gap:
    label: "Collaboration framing gap"
    evidence_summary: "The opening request still misses goal, constraints, or acceptance too often."
    why_it_happens: "Task framing is not yet stable enough, so later background fill-in remains costly."
    suggested_action: "Turn goal, relevant files, constraints, and acceptance criteria into a fixed opening skeleton."
  agentic_system_gap:
    label: "Agentic system gap"
    evidence_summary: "Reusable skill / workflow / MCP assets are not yet leveraged consistently."
    why_it_happens: "Work still leans on one-off improvisation instead of distilling effective moves into reusable assets."
    suggested_action: "Capture recurring collaboration patterns as skills / workflows / rules and reuse them on similar tasks."
  workflow_composition_gap:
    label: "Workflow composition gap"
    evidence_summary: "The execution rhythm can still be pulled by the current answer."
    why_it_happens: "Task decomposition and step composition are not yet fully internalized."
    suggested_action: "Use a fixed inspect, plan, implement, verify rhythm for complex tasks."
  code_penetration_gap:
    label: "Implementation depth gap"
    evidence_summary: "Depth on critical implementation paths and boundaries is not yet stable."
    why_it_happens: "It is still easy to accept conceptual advice before collecting implementation evidence."
    suggested_action: "Make 'read the code and trace the boundary first' your default move before choosing the fix."
  verification_gap:
    label: "Verification gap"
    evidence_summary: "The most common missing move after changes is verification."
    why_it_happens: "Implementation speed is ahead of verification closure, so the done definition stays unstable."
    suggested_action: "Add at least one minimal verification step after each implementation before closing."
  closure_gap:
    label: "Closure gap"
    evidence_summary: "Results often get close to done, but conclusion and residual risk are under-explained."
    why_it_happens: "More attention goes into making the change than proving the result is deliverable."
    suggested_action: "End each task with result, verification, remaining risk, and explicit done-state."
  debug_recovery_gap:
    label: "Recovery steering gap"
    evidence_summary: "Course correction and new evidence injection are still not stable enough."
    why_it_happens: "Retries can still repeat the path rather than reset from new evidence."
    suggested_action: "When blocked, state what is wrong, what new evidence you have, and what the next minimal path is."

growth_stage:
  L1:
    label: "Observation start"
    summary: "You have entered real AI collaboration, but stable methods are not formed yet."
  L2:
    label: "Collaboration forming"
    summary: "You can move work forward, but good outcomes are still not stable and can depend on improvisation."
  L3:
    label: "Stable execution"
    summary: "You can already move most tasks forward reliably; the next step is to make closure more solid."
  L4:
    label: "Reliable closure"
    summary: "Current data shows work more often reaches verification and deliverable states alongside forward progress."
  L5:
    label: "Scaled reuse"
    summary: "You already show strong reuse and leverage; the next growth target is durable consistency and method capture."

