    deficits:
      missing-context:
        description: "Background, symptom, or key files are not fully present in the first message."
        impact: "The AI has to clarify or guess before it can move, which increases rework."
      vague-request:
        description: "The request expresses intent, but not an execution sequence or done definition."
        impact: "The AI is more likely to give advice instead of entering an executable path."
      late-constraint:
        description: "Critical constraints arrive only in later turns."
        impact: "Early work becomes partially wasted and has to be redone."
      unclear-correction:
        description: "Course correction says what is wrong, but not the correct boundary."
        impact: "The AI can continue along the same incorrect path."
      scope-drift:
        description: "The change boundary is not locked before execution."
        impact: "The AI can widen the change surface and create extra risk."
      missing-acceptance-criteria:
        description: "The request does not define what counts as passing."
        impact: "The AI can close too early and still leave follow-up work."
      assumption-not-surfaced:
        description: "Important assumptions remain implicit instead of being stated."
        impact: "The AI fills them in on its own, which makes the output unstable."
    rewrite_problem_map:
      context_provision: "The original request is missing critical context, so the AI has to guess."
      request_specificity: "The original request is too broad and does not define the action path."
      scope_management: "The original request does not lock scope."
      information_timing: "The original request introduces critical constraints too late."
      correction_quality: "The original correction does not define a clear boundary reset."
    rewrite_problem_default: "The original wording is not stable enough and leaves too much room for guessing."
    rewrite_why_default: "The better version front-loads context, goal, and boundary, so the AI can move correctly in the first turn."
    rewrite_fallbacks:
      context_provision:
        scene: "requirements_design"
        problem: "The opening context is too thin, so the AI has to clarify first."
        better_prompt: "Background: ...\nCurrent problem: ...\nTarget outcome: ...\nConstraints: ...\nReferences: ...\nAcceptance: ...\nOutput format: ..."
        why: "Once context and acceptance are front-loaded, the AI can go directly into execution."
      request_specificity:
        scene: "code_review"
        problem: "The ask is too broad, so the AI cannot tell whether to diagnose, modify, or verify first."
        better_prompt: "Please diagnose first, then give the minimal change, and finally state whether it passes the acceptance criteria."
        why: "A clear action order makes delivery more stable."
    universal_template:
      title: "Reusable universal request template"
      common_gap: "The most common gap is that background, acceptance, and output format are not stated together."
      body: |
        Background: ...
        Current problem: ...
        Target outcome: ...
        Constraints: ...
        References: ...
        Acceptance criteria: ...
        Output format: ...
    scenario_templates:
      - id: "template:code_review"
        title: "Code Review"
        scene: "code_review"
        common_gap: "The most common omission is the review goal and evaluation standard."
        template: "Please review this change. Background: ... Current problem: ... Target outcome: identify risks, regressions, and missing tests. Constraints: do not redesign the architecture. References: ... Acceptance criteria: findings prioritized by severity. Output format: findings first."
      - id: "template:requirements_design"
        title: "Requirements Design"
        scene: "requirements_design"
        common_gap: "The most common omission is scope, constraints, and acceptance."
        template: "Please help design this requirement. Background: ... Current problem: ... Target outcome: a plan ready for implementation. Constraints: ... References: ... Acceptance criteria: include scope, flow, risk, and acceptance. Output format: structured sections."
      - id: "template:bug_triage"
        title: "Bug Triage"
        scene: "bug_triage"
        common_gap: "The most common omission is the symptom, reproduction condition, and forbidden changes."
        template: "Please help triage this bug. Background: ... Current problem: ... Target outcome: identify the root cause and the minimal fix path. Constraints: do not change the API contract. References: logs / file paths ... Acceptance criteria: root cause and verification path are explicit. Output format: root cause -> change -> verify."
      - id: "template:architecture_refactor"
        title: "Architecture Refactor"
        scene: "architecture_refactor"
        common_gap: "The most common omission is the scope boundary and what must stay untouched."
        template: "Please assess this architecture refactor. Background: ... Current problem: ... Target outcome: a gradual refactor plan. Constraints: do not change external interfaces. References: ... Acceptance criteria: include benefits, risks, and migration steps. Output format: options + recommendation."
      - id: "template:copy_polish"
        title: "Copy Polish"
        scene: "copy_polish"
        common_gap: "The most common omission is audience, tone, and pass criteria."
        template: "Please improve this copy. Background: ... Current problem: ... Target outcome: who it is for and what effect it should create. Constraints: tone / length / banned phrases ... References: original text ... Acceptance criteria: clearer and more focused. Output format: issue summary + improved version."
      - id: "template:chart_analysis"
        title: "Chart Analysis"
        scene: "chart_analysis"
        common_gap: "The most common omission is the actual question you want the chart to answer."
        template: "Please analyze this chart. Background: ... Current problem: the exact question I want answered. Target outcome: key conclusions and next-step suggestions. Constraints: do not invent missing data. References: chart / dataset ... Acceptance criteria: every conclusion ties back to the data. Output format: conclusion -> evidence -> recommendation."
    checklist_map:
      missing-context:
        - "Did I state the background, symptom, and key files clearly?"
        - "Did I include the target outcome and constraints?"
      vague-request:
        - "Did I turn this into a concrete action sequence?"
        - "Did I specify the output format?"
      late-constraint:
        - "Are the critical constraints already in the first message?"
      unclear-correction:
        - "If the last answer drifted, did I state the mistake, the correct boundary, and the next step together?"
      scope-drift:
        - "Did I say what can change and what must not change?"
      missing-acceptance-criteria:
        - "Did I define what counts as passing?"
      assumption-not-surfaced:
        - "Did I turn my hidden assumptions into explicit context?"
    checklist_default:
      - "Did I state the target outcome?"
      - "Did I say what must not be done?"
      - "Did I define acceptance criteria?"
      - "Did I specify the output format?"
    seven_day_plan:
      - day: 1
        theme: "Spot {deficit}"
        action: "Review one real request from today and mark where {deficit} showed up."
      - day: 2
        theme: "Front-load context"
        action: "Before each request, add background, target, and constraints."
      - day: 3
        theme: "Use the template"
        action: "Pick one real task and send it with the improved structure."
      - day: 4
        theme: "Add acceptance"
        action: "Add one sentence that defines what passing looks like."
      - day: 5
        theme: "Lock scope"
        action: "State what is allowed to change and what is not."
      - day: 6
        theme: "Correction drill"
        action: "When the AI drifts, resend using problem -> correct boundary -> next step."
      - day: 7
        theme: "Review and keep"
        action: "Pick the most effective rewrite card and turn it into your default template."
