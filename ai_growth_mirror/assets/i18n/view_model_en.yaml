capability_meta:
  collaboration_framing:
    label: "Collaboration Framing"
    explanation: "How effectively you frame the direction, provide environment context, and accelerate goal locking across turns."
    next_action: "Clarify task type, goal boundary, input material, and acceptance method before moving into design, analysis, or implementation output."
  execution_driving:
    label: "Execution Driving"
    explanation: "How actively you steer the collaboration instead of following the current answer."
    next_action: "Use a deliberate inspect -> plan -> implement -> verify progression on complex work."
  implementation_depth:
    label: "Implementation Depth"
    explanation: "How consistently you move into real code, control flow, and system boundaries."
    next_action: "Open the core files and trace the implementation path before deciding the fix."
  delivery_closure:
    label: "Delivery Closure"
    explanation: "How often your sessions reach verification, conclusion, and a usable deliverable state."
    next_action: "After implementation, always add one minimal verification step plus a done-state summary."
  adaptive_recovery:
    label: "Recovery Steering"
    explanation: "How well you recover from drift, errors, or blockers using new evidence."
    next_action: "When steering back, state what was wrong, what changed, and the new minimal path."
  agentic_system:
    label: "Agentic System"
    explanation: "How effectively you leverage and author reusable AI assets (skills, workflows, MCPs) to systemize cooperation."
    next_action: "Use skills, workflows, and MCP configs to capture repeatable collaboration steps."

radar_axes:
  collaboration_framing:
    reason_high: "You frame direction quickly, provide effective context across turns, and lock goals efficiently."
    reason_low: "The direction is too broad, leading the AI to wander or fail to lock onto actionable tasks in early turns."
    tooltip: "score {score} · direction clarity {direction_clarity_rate}% · context grounding {context_grounding_rate}% · goal locking speed {goal_locking_speed} pts · active clarification {active_clarification_rate}%"
  execution_driving:
    reason_high: "You actively organize the collaboration rhythm and tool path."
    reason_low: "The session can still stall in discussion instead of a stable execution chain."
  implementation_depth:
    reason_high: "You move into code, implementation, and boundaries rather than stopping at surface advice."
    reason_low: "Depth on the core implementation path is not yet stable."
  delivery_closure:
    reason_high: "Tasks usually reach verification and a clear closed state."
    reason_low: "Implementation can move forward, but verification and closure are not yet default habits."
  adaptive_recovery:
    reason_high: "When work drifts or stalls, you usually steer it back effectively."
    reason_low: "Course correction and new evidence injection are still not sharp enough."
  agentic_system:
    reason_high: "You leverage and author reusable AI assets (skills, workflows, MCPs) for systemized collaboration."
    reason_low: "You rely more on ad-hoc prompts rather than capturing repeatable methods into assets."
    tooltip: "score {score} · skill usage {skill_usage_pct}% · structured workflows {structured_pct}% · asset creation {asset_authoring_pct}%"
    gap_reason: "Agentic System is weak: try using skills, workflows, or MCP configs to capture repeatable cooperation steps."

