methodology:
  title: "AI Growth Mirror 的判断围绕四个协作支柱（展开为六轴雷达度量）"
  lines:
    - "Context Frame：是否在协作启动与对齐阶段建立清晰的目标、约束和验收标准（可通过单轮精准或多轮澄清完成）。"
    - "Flow Orchestration：是否能让 AI 连续推进，而不是每一步都靠人工救火。"
    - "Proof Loop：是否做验证、测试、回看，避免停留在“看起来可行”。"
    - "Method Asset：是否把有效做法沉淀成模板、规则、脚本或可复用流程。"
    - "这四个支柱会展开成六轴雷达来打分：Context Frame → 协作框定；Flow Orchestration → 协作驱动 + 实现下潜；Proof Loop → 交付收口 + 恢复推进；Method Asset → Agentic 系统化。"

