capability_meta:
  collaboration_framing:
    label: "协作框定"
    explanation: "衡量你在多轮协作中，是否能快速框定方向、提供环境上下文，并加速目标锁定。"
    next_action: "引导 AI 时：先明确任务类型、目标边界、输入材料和验收方式，再进入设计、分析或实现产出。"
  execution_driving:
    label: "协作驱动"
    explanation: "衡量你是否会主动组织协作节奏，而不是被 AI 当前回答牵着走。"
    next_action: "复杂任务固定按 侦察 -> 方案 -> 实施 -> 验证 四步推进。"
  implementation_depth:
    label: "实现下潜"
    explanation: "衡量你是否真正进入代码、实现链路和关键边界，而不是停留在表层建议。"
    next_action: "先打开核心文件和关键链路，再决定方案与改动范围。"
  delivery_closure:
    label: "交付收口"
    explanation: "衡量你是否能把任务带到验证、结论和可交付状态。"
    next_action: "每次实现后固定补：最小验证、结果说明、剩余风险。"
  adaptive_recovery:
    label: "恢复推进"
    explanation: "衡量你在偏航、报错或阻塞时，能否快速基于新证据切回正确路径。"
    next_action: "纠偏时固定说清：哪里错了、有什么新证据、下一步怎么走。"
  agentic_system:
    label: "Agentic 系统化"
    explanation: "衡量你是否能使用和沉淀可复用的 AI 资产（如 skill、workflow、MCP 插件等）来赋能 AI 自主推进。"
    next_action: "尝试用 skill/workflow/MCP 沉淀可复用协作方法。"

radar_axes:
  collaboration_framing:
    reason_high: "你已会快速向 AI 框定方向，多轮交互中能提供有效上下文并快速锁定目标。"
    reason_low: "引导方向偏宽泛，AI 容易在前期轮次中多次迷茫或无法锁定有效操作。"
    tooltip: "轴分 {score} · 方向清晰 {direction_clarity_rate}% · 上下文注入 {context_grounding_rate}% · 目标锁定速度 {goal_locking_speed}分 · 主动澄清率 {active_clarification_rate}%"
  execution_driving:
    reason_high: "你已经会主动组织 AI 的推进节奏和工具路径。"
    reason_low: "协作仍容易停在泛讨论，推进链不够稳定。"
  implementation_depth:
    reason_high: "你会进入代码、实现和边界，而不是停留在表层建议。"
    reason_low: "对核心实现链路的下潜还不够稳定。"
  delivery_closure:
    reason_high: "任务通常能被带到验证和收口阶段。"
    reason_low: "实现能推进，但验证与收口还没有变成默认动作。"
  adaptive_recovery:
    reason_high: "遇到偏航或阻塞时，你通常能把协作拉回正轨。"
    reason_low: "偏航后的纠偏和新证据补充还不够锐利。"
  agentic_system:
    reason_high: "你已开始构建和复用 skill、workflow、MCP 等 Agent 资产来做系统化人机协作。"
    reason_low: "较少沉淀和复用结构化 AI 资产，更多依赖单次对话的即兴发挥。"
    tooltip: "轴分 {score} · skill 使用率 {skill_usage_pct}% · workflow 结构化 {structured_pct}% · 资产创作 {asset_authoring_pct}%"
    gap_reason: "Agentic 系统化能力偏弱：尝试用 skill/workflow/MCP 沉淀可复用协作方法"

