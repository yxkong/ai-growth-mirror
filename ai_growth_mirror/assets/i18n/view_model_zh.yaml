prompt_coach:
  label_pq_improved: "改善项"
  label_pq_worsened: "下降项"
  label_rewrite_examples: "改写示例"
  label_friction_synthesis: "摩擦综合判断"
  label_generated_by: "生成方式"
  label_universal_template: "通用提需求模板"
  label_pq_source_detail: "Prompt Quality 来源明细"
  strength_card:
    label_prefix: "继续保留：{label}"
    evidence: "这一维度是你当前最稳定的 Prompt 长板，说明它已经开始形成习惯。"
    message: "不要只盯着短板，也要把现有长板复制到更多任务类型里。"
    action: "接下来，刻意在 3 个不同任务里复用 {label} 这项输入习惯。"
  deficit_cards:
    missing-context:
      label: "最容易浪费轮次：上下文缺失"
      kind: "证据"
      evidence: "最近 {count} 次会话出现上下文不足信号，说明 AI 往往需要先补问再行动。"
      action: "把目标、现象、文件、约束、验收写成首轮固定骨架。"
    missing-acceptance-criteria:
      label: "最容易提前收口：没有验收标准"
      kind: "证据"
      evidence: "最近 {count} 次会话没有明确完成标准，AI 更容易过早判断“差不多完成”。"
      action: "每次都写一个最小可验证的完成标准。"
    vague-request:
      label: "最容易变泛建议：请求过泛"
      kind: "证据"
      evidence: "最近 {count} 次会话出现愿望式提问，AI 更容易给方向而不是直接产出。"
      action: "把请求重写成动作序列：定位、修改、验证、总结。"
    unclear-correction:
      label: "最容易重复偏航：纠偏不够锐利"
      kind: "证据"
      evidence: "最近 {count} 次会话里，纠偏边界不够清楚，AI 容易沿旧方向继续前进。"
      action: "纠偏时必须同时给出错误点、正确边界和下一步。"
  deficit_message: "这不是一次输入失误，而是当前最稳定的失败模式。"
  dimension_gap_message: "这项短板一旦稳定修好，追问次数和返工成本会一起下降。"
  dimension_cards:
    context_provision:
      label: "把背景前置，不要让 AI 先猜"
      kind: "短板"
      evidence: "首轮缺少文件、现象或边界时，返工和追问会显著增多。"
      action: "下次首轮至少写清现象、相关文件、约束和验收。"
      better_prompt: |
        【Bug 修复】
        现象：[具体报错或不符合预期的行为]
        复现：[触发步骤]
        相关文件：[文件路径1, 文件路径2]
        约束：[不允许改动的范围]
        验收：[怎么证明 bug 已修复]
    request_specificity:
      label: "把任务说成动作，不要说成愿望"
      kind: "短板"
      evidence: "当请求过于泛化时，AI 更容易给建议，而不是直接产出结果。"
      action: "把“帮我看看”改成“请定位→修改→验证→总结”。"
      better_prompt: |
        【功能实现】
        目标：[要实现什么功能，一句话]
        现状：[当前代码 / 系统状态]
        约束：[不允许改的接口或文件]
        最小实现：[先做哪一步，不要一次全做]
        验收：[怎么证明功能完成]
    scope_management:
      label: "先锁边界，再开工"
      kind: "短板"
      evidence: "边界不清时，AI 很容易顺手扩大改动面。"
      action: "首轮显式写出只允许改什么、禁止改什么。"
      better_prompt: |
        【重构 / 优化】
        范围：[只允许改动的文件或模块]
        目标：[改完应该好在哪里，一句话]
        禁止：[不允许改动的接口 / 行为 / 文件]
        最小第一步：[从哪里开始，改完什么算第一步完成]
        验收：[现有测试要绿 + 手动验证点]
    information_timing:
      label: "重要信息不要后补"
      kind: "短板"
      evidence: "关键信息在第 2、3 轮才补进来，会让前几轮工作白做。"
      action: "把关键约束和背景前置，而不是等 AI 开始后再纠偏。"
      better_prompt: |
        【设计 / 方案决策】
        决策问题：[需要在哪两个方案之间选择]
        当前约束：[性能 / 维护性 / 时间等限制]
        已知背景：[当前架构 / 技术栈]
        期望输出：[给出方案对比 + 推荐理由，不直接写代码]
    correction_quality:
      label: "纠偏要能直接改方向"
      kind: "短板"
      evidence: "只说“不对”不足以让 AI 快速收敛。"
      action: "纠偏时用“哪里错了→正确边界→下一步”三段式。"
      better_prompt: |
        【增量推进 / 纠偏】
        上一轮问题：[具体哪里不符合预期]
        正确边界：[应该是什么，不应该是什么]
        这一步只做：[把大任务拆成当前最小一步]
        停止条件：[这一步完成的明确标志]
