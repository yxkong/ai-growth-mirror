capability_meta:
  intent_clarity:
    label: "任务表达"
    explanation: "衡量你是否能把目标、边界与验收条件清楚前置给 AI。"
    next_action: "首轮固定补齐：目标、相关文件、约束、验收标准。"
  execution_driving:
    label: "协作驱动"
    explanation: "衡量你是否会主动组织协作节奏，而不是被 AI 当前回答牵着走。"
    next_action: "复杂任务固定按 侦察 -> 方案 -> 实施 -> 验证 四步推进。"
  implementation_depth:
    label: "实现下潜"
    explanation: "衡量你是否真正进入代码、实现链路和关键边界，而不是停留在表层建议。"
    next_action: "先打开核心文件和关键链路，再决定方案与改动范围。"
  delivery_closure:
    label: "交付收口"
    explanation: "衡量你是否能把任务带到验证、结论和可交付状态。"
    next_action: "每次实现后固定补：最小验证、结果说明、剩余风险。"
  adaptive_recovery:
    label: "恢复推进"
    explanation: "衡量你在偏航、报错或阻塞时，能否快速基于新证据切回正确路径。"
    next_action: "纠偏时固定说清：哪里错了、有什么新证据、下一步怎么走。"

radar_axes:
  intent_clarity:
    reason_high: "目标、约束与验收通常能前置给到 AI。"
    reason_low: "任务上下文经常需要在中途补齐。"
  execution_driving:
    reason_high: "你已经会主动组织 AI 的推进节奏和工具路径。"
    reason_low: "协作仍容易停在泛讨论，推进链不够稳定。"
  implementation_depth:
    reason_high: "你会进入代码、实现和边界，而不是停留在表层建议。"
    reason_low: "对核心实现链路的下潜还不够稳定。"
  delivery_closure:
    reason_high: "任务通常能被带到验证和收口阶段。"
    reason_low: "实现能推进，但验证与收口还没有变成默认动作。"
  adaptive_recovery:
    reason_high: "遇到偏航或阻塞时，你通常能把协作拉回正轨。"
    reason_low: "偏航后的纠偏和新证据补充还不够锐利。"

growth_gaps:
  framing_gap:
    label: "任务表达短板"
    evidence_summary: "首轮目标、约束或验收仍会缺项。"
    why_it_happens: "任务 framing 还不够稳定，导致中途补背景成本偏高。"
    suggested_action: "把目标、相关文件、约束、验收标准做成首轮固定骨架。"
  workflow_composition_gap:
    label: "协作编排短板"
    evidence_summary: "推进节奏还会受当前回答牵动。"
    why_it_happens: "任务拆分与步骤编排尚未完全内化。"
    suggested_action: "复杂任务统一按侦察、方案、实施、验证四步推进。"
  code_penetration_gap:
    label: "实现下潜短板"
    evidence_summary: "进入关键实现链路和边界的深度还不够稳定。"
    why_it_happens: "容易先接受概念性方案，再回头补实现证据。"
    suggested_action: "把“先看代码和关键边界”设成默认动作，再决定修改方案。"
  verification_gap:
    label: "验证短板"
    evidence_summary: "改动后最容易缺的是验证动作。"
    why_it_happens: "实现推进快于验证收口，导致完成定义不够稳定。"
    suggested_action: "每次实现后至少补一个最小验证动作，再决定是否收口。"
  closure_gap:
    label: "收口短板"
    evidence_summary: "结果经常接近完成，但收尾结论和风险说明不足。"
    why_it_happens: "更多关注把事情做出来，而不是把结果明确交付。"
    suggested_action: "收尾时固定输出：结果、验证、剩余风险、是否完成。"
  debug_recovery_gap:
    label: "恢复推进短板"
    evidence_summary: "偏航后的纠偏和新证据补充还不够稳定。"
    why_it_happens: "重试路径偶尔重复，缺少基于新证据的重设。"
    suggested_action: "遇到阻塞时先说明哪里错了、有什么新证据、下一条最小路径是什么。"

growth_stage:
  L1:
    label: "起步观察期"
    summary: "你已经开始进入真实 AI 协作，但稳定方法还没有形成。"
  L2:
    label: "协作成型期"
    summary: "你能推进任务，但好结果还不够稳定，容易依赖临场发挥。"
  L3:
    label: "稳定推进期"
    summary: "你已经具备稳定推进多数任务的能力，下一步重点是把闭环做实。"
  L4:
    label: "高效闭环期"
    summary: "你不只是会推进，还能更稳定地把结果带到验证和交付状态。"
  L5:
    label: "放大复用期"
    summary: "你已经具备较强的复用与放大能力，成长重点转向持续稳定和方法沉淀。"

