# Growth plan — English UI skeleton + reusable prompt templates
#
# Architecture rule (see docs/design/ARCHITECTURE_PRINCIPLES.md):
#   - Personalized content (why/actions/evidence) = generated by `infra/llm/coach.py`
#   - This file only provides: ① UI display labels ② reusable practice_prompt templates
#   - heuristic/offline mode: show title + practice_prompt; why/actions left empty

headline: ""

priorities:
  collaboration_framing:
    title: "Collaboration Framing"
    why: ""
    success_signal: "Whether the task is design, analysis, or implementation, the goal, boundary, input material, and acceptance method are aligned early."
    stop_doing: "Giving overly broad direction that leaves the AI wandering or failing to lock onto a useful deliverable early."
    week_1_actions: []
    practice_prompt: "First classify whether this task is design, analysis, or implementation, then check whether the goal, boundary, input material, and acceptance method are clear. If key information is missing, list the gaps and ask before producing output."

  execution_driving:
    title: "Execution driving"
    why: ""
    success_signal: "Complex tasks follow a deliberate rhythm, with the right tools or parallel paths chosen on purpose."
    stop_doing: "Following the current answer without defining the next step, and staying in open-ended discussion."
    week_1_actions: []
    practice_prompt: "Handle this task in four steps: inspect -> plan -> implement -> verify. Give the smallest useful conclusion after each step before continuing."

  implementation_depth:
    title: "Implementation depth"
    why: ""
    success_signal: "You enter core code, implementation paths, and boundaries before choosing the change scope."
    stop_doing: "Accepting conceptual advice first and only collecting implementation evidence during execution."
    week_1_actions: []
    practice_prompt: "Do not stop at high-level advice. Open the relevant code, trace the real implementation path and boundaries, then propose the smallest code change."

  delivery_closure:
    title: "Delivery closure"
    why: ""
    success_signal: "After changes, there is checkable verification and an explicit statement of whether the task is done."
    stop_doing: "Closing with only a change summary and no minimal verification step."
    week_1_actions: []
    practice_prompt: "After implementation, take the task to a deliverable state: run a minimal verification step, summarize the result, list remaining risks, and state whether the task is actually done."

  adaptive_recovery:
    title: "Recovery steering"
    why: ""
    success_signal: "After drift, you reset the path from new evidence instead of retrying the same approach."
    stop_doing: "Saying only 'this is wrong' without the mistake, boundary, and next step."
    week_1_actions: []
    practice_prompt: "If the current path is wrong, do not retry mechanically. Explain: 1. what is wrong 2. what new evidence changed the view 3. what the new minimal path is."

  agentic_system:
    title: "Method systemization"
    why: "This is not about writing longer prompts. It turns recurring evaluation criteria into rules, skills, or workflows so the next natural-language task starts on the right path by default."
    success_signal: "Similar tasks automatically trigger the right skill, rule, or workflow, and the user needs fewer follow-up corrections about boundaries and acceptance."
    stop_doing: "Relying on ad-hoc follow-up corrections to add principles, counterexamples, and acceptance criteria each time."
    week_1_actions: []
    practice_prompt: "Before execution, check whether this task already has a reusable rule, skill, or workflow. If not, produce a minimal action contract first: judgement criteria, counterexample boundaries, evidence requirements, delivery mode, and validation gates."

  friction:
    title: "Correction clarity"
    why: ""
    success_signal: ""
    stop_doing: ""
    week_1_actions: []
    practice_prompt: "The last response went wrong. The issue is: <specific problem>. The correct boundary is: <correct scope/constraint>. Please continue within this boundary and state a minimal new plan first."

  consolidation:
    title: "Strength consolidation"
    why: ""
    success_signal: ""
    stop_doing: ""
    week_1_actions: []
    practice_prompt: "Please use the same planning, constraint, and verification style as my most successful recent session to complete this task."

prompt_dimensions:
  context_provision:
    title: "Context provision"
    why: ""
    tip: "Fill in goal, current state, relevant files, constraints, and acceptance criteria before asking."
    success_signal: ""
    stop_doing: ""
    week_1_actions: []
    practice_prompt: "Goal: <what to accomplish>\nCurrent state: <status/error/background>\nRelevant files: <path1, path2>\nConstraints: <what not to change>\nAcceptance: <definition of done>\nPlease plan briefly, then execute, and verify at the end."

  request_specificity:
    title: "Request specificity"
    why: ""
    tip: "Replace 'take a look' with 'locate → fix → verify → summarize'."
    success_signal: ""
    stop_doing: ""
    week_1_actions: []
    practice_prompt: "Please locate the root cause first, then provide the minimal fix, execute a verification step, and summarize the result and remaining risks."

  scope_management:
    title: "Scope management"
    why: ""
    tip: "Explicitly state 'only change X, do not change Y' in the prompt."
    success_signal: ""
    stop_doing: ""
    week_1_actions: []
    practice_prompt: "Only modify <file/module>. Do not change API contracts, database schema, or unrelated shared components. Provide the minimal plan first, then implement."

  information_timing:
    title: "Information timing"
    why: ""
    tip: "Front-load key constraints in the first message rather than adding them after the AI starts."
    success_signal: ""
    stop_doing: ""
    week_1_actions: []
    practice_prompt: "Before starting, plan around these constraints: <constraint1> <constraint2> <acceptance criteria>. If information is insufficient, list the gaps first instead of proceeding."

  correction_quality:
    title: "Correction quality"
    why: ""
    tip: "When the AI goes off-track, use: problem → correct boundary → next action."
    success_signal: ""
    stop_doing: ""
    week_1_actions: []
    practice_prompt: "The last response was incorrect. The problem is: <specific issue>. The correct boundary is: <correct scope/constraint>. Please continue within that boundary and state a minimal new plan first."
