archetype:
  name_pattern: "{planning}{orchestration}型"
  tag_pattern: "{evidence}×{reuse}"

poles:
  planning:
    high: "构图"
    low: "直切"
  orchestration:
    high: "编排"
    low: "盯盘"
  evidence:
    high: "证据"
    low: "结论"
  reuse:
    high: "资产"
    low: "冲刺"

dimensions:
  planning:
    label: "启动方式"
    left_pole: "构图式"
    right_pole: "直切式"
    interpretation_high: "更偏先铺好问题地图再推进"
    interpretation_low: "更偏快速切入再边做边收敛"
  orchestration:
    label: "推进方式"
    left_pole: "编排式"
    right_pole: "盯盘式"
    interpretation_high: "更偏给 AI 分段推进和组合能力"
    interpretation_low: "更偏自己持续盯住关键步骤"
  evidence:
    label: "收口方式"
    left_pole: "证据式"
    right_pole: "结论式"
    interpretation_high: "更偏用验证结果决定是否收口"
    interpretation_low: "更偏基于结论判断任务是否完成"
  reuse:
    label: "复用方式"
    left_pole: "资产式"
    right_pole: "冲刺式"
    interpretation_high: "更偏把好方法沉淀下来复用"
    interpretation_low: "更偏先冲完成度，沉淀动作较少"

strengths:
  planning: "你会先搭问题框架，再让 AI 动手。"
  orchestration: "当前信号显示多路径协作和能力组合已经开始出现。"
  evidence: "你更愿意用验证结果来收口，这会显著降低返工。"
  reuse: "你具备方法资产化倾向，容易沉淀出可复用工作法。"
  fallback: "你的协作节奏很实战，愿意快速推进真实任务。"

growth:
  planning: "复杂任务先冻结目标、边界和验收，不要边做边猜。"
  orchestration: "开始有意识地判断什么时候该搜索、委托或拆并行路径。"
  evidence: "把验证从偶发动作升级为默认收口步骤。"
  reuse: "每周至少把一个高频动作沉淀成模板、清单或 Skill 草稿。"

narrative:
  slogan: "当前协作信号正在形成可观察的操作系统轮廓。"
  description: "当前更接近“{archetype_name}”的协作风格。这个判断基于任务启动方式、AI 推进方式、收口判断和方法留存信号。"
  description_evidence_low: " 当前最大的升级空间通常不在更多工具，而在更强的证据收口。"
  description_reuse_low: " 你已经能做出结果，下一步要把结果变成可复用方法。"
