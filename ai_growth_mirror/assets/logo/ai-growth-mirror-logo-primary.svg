<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI Growth Mirror logo</title>
  <desc id="desc">A hexagonal six-axis capability radar with an upward growth arrow and a mirror sheen.</desc>
  <defs>
    <linearGradient id="radar" x1="200" y1="300" x2="824" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="data" x1="247" y1="600" x2="730" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="arrow" x1="360" y1="660" x2="710" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="shard" x1="430" y1="640" x2="600" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0E7FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 480) rotate(90) scale(420)">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="60" y="40" width="904" height="904" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ambient glow (transparent background) -->
  <circle cx="512" cy="480" r="420" fill="url(#glow)"/>

  <!-- mirror sheen shard behind the mark -->
  <path d="M470 640L432 372L600 318L568 600Z" fill="url(#shard)"/>

  <!-- six-axis radar grid -->
  <g filter="url(#neon)">
    <polygon points="512,120 824,300 824,660 512,840 200,660 200,300" stroke="url(#radar)" stroke-width="16" stroke-linejoin="round" fill="none"/>
    <polygon points="512,240 720,360 720,600 512,720 304,600 304,360" stroke="url(#radar)" stroke-width="9" stroke-opacity="0.7" stroke-linejoin="round" fill="none"/>
    <polygon points="512,360 616,420 616,540 512,600 408,540 408,420" stroke="url(#radar)" stroke-width="6" stroke-opacity="0.5" stroke-linejoin="round" fill="none"/>
    <g stroke="url(#radar)" stroke-width="5" stroke-opacity="0.45">
      <line x1="512" y1="480" x2="512" y2="120"/>
      <line x1="512" y1="480" x2="824" y2="300"/>
      <line x1="512" y1="480" x2="824" y2="660"/>
      <line x1="512" y1="480" x2="512" y2="840"/>
      <line x1="512" y1="480" x2="200" y2="660"/>
      <line x1="512" y1="480" x2="200" y2="300"/>
    </g>
    <!-- ticks on the top axis -->
    <g stroke="url(#radar)" stroke-width="6" stroke-opacity="0.65" stroke-linecap="round">
      <line x1="496" y1="200" x2="528" y2="200"/>
      <line x1="496" y1="280" x2="528" y2="280"/>
      <line x1="496" y1="360" x2="528" y2="360"/>
    </g>
  </g>

  <!-- capability footprint -->
  <polygon points="512,150 726,348 686,576 512,690 282,612 251,330"
           fill="url(#data)" fill-opacity="0.16" stroke="url(#data)" stroke-width="12" stroke-linejoin="round"/>

  <!-- upward growth arrow -->
  <g filter="url(#neon)">
    <path d="M362 648C418 612 452 548 486 556C522 564 520 626 566 606C620 583 648 502 690 360"
          stroke="url(#arrow)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M652 380L693 348L716 396" stroke="url(#arrow)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M362 648C418 612 452 548 486 556C522 564 520 626 566 606C620 583 648 502 690 360"
          stroke="#ECFDF5" stroke-width="10" stroke-opacity="0.65" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- AI nodes -->
  <g>
    <circle cx="512" cy="150" r="17" fill="#34D399" stroke="#0B1020" stroke-width="6"/>
    <circle cx="251" cy="330" r="15" fill="#8B5CF6" stroke="#0B1020" stroke-width="6"/>
    <circle cx="726" cy="348" r="15" fill="#60A5FA" stroke="#0B1020" stroke-width="6"/>
    <circle cx="282" cy="612" r="13" fill="#A78BFA" stroke="#0B1020" stroke-width="6"/>
    <circle cx="686" cy="576" r="13" fill="#34D399" stroke="#0B1020" stroke-width="6"/>
  </g>
</svg>
