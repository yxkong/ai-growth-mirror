[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-growth-mirror"
version = "1.0.2"
description = "Local-first AI collaboration growth mirror — cross-tool analysis and personal growth reports"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ai-growth-mirror contributors" }]
dependencies = [
  "click>=8.1",
  "jinja2>=3.1",
  "openai>=1.50",
  "pyyaml>=6.0",
  "python-dateutil>=2.8",
  "zstandard>=0.23",
]

[project.optional-dependencies]
llm = [
  "anthropic>=0.40",
  "google-generativeai>=0.8",
]
dev = ["pytest>=8.0"]

[project.scripts]
ai-growth-mirror = "ai_growth_mirror.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["ai_growth_mirror"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --basetemp=.tmp/pytest"
cache_dir = ".tmp/pytest-cache"
